version: "3.9"
services:
  fastapi-backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit-ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 7860 --server.address 0.0.0.0
    ports:
      - "7860:7860"
    depends_on:
      - fastapi-backend
    restart: unless-stopped
